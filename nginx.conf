events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    server {
        listen 80;

        # Swipe Match Service
        location /api/v1/swipes/ {
            proxy_pass http://swipe-match:8080/api/v1/swipes/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/matches/ {
            proxy_pass http://swipe-match:8080/api/v1/matches/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # User Job Service (Everything else under /api/)
        location /api/ {
            proxy_pass http://user-job:8081/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Healthcheck endpoint
        location /health {
            return 200 'healthy\n';
        }
    }
}
