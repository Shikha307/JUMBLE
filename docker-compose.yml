services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  user-job:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=${MONGO_URI:-mongodb+srv://jumble_app_user:test123@jumble.ewhoayr.mongodb.net/jumbledb?retryWrites=true&w=majority&appName=JUMBLE}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://host.docker.internal:8000/generate-cover-letter}
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8081/api/jobs/all || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  swipe-match:
    build:
      context: ./swipe-match-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_DATA_MONGODB_URI=${MONGO_URI:-mongodb+srv://jumble_app_user:test123@jumble.ewhoayr.mongodb.net/jumbledb?retryWrites=true&w=majority&appName=JUMBLE}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8080/api/v1/swipes/jobs/test/unswiped-candidates || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client/public/ml_outputs:/app/public/ml_outputs
    depends_on:
      - user-job
      - swipe-match
    restart: always

  ml-worker:
    build:
      context: ./ml
      dockerfile: Dockerfile
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-}
      - ML_OUTPUT_DIR=/ml_outputs
      - MONGO_URI=${MONGO_URI:-mongodb+srv://jumble_app_user:test123@jumble.ewhoayr.mongodb.net/jumbledb?retryWrites=true&w=majority&appName=JUMBLE}
    volumes:
      - ./client/public/ml_outputs:/ml_outputs
    depends_on:
      - user-job
      - swipe-match
    restart: always

